name: CI

on:
  push:
  pull_request:

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r engine_python/requirements.txt
      - name: Run Python tests (includes shared test_cases.json)
        run: pytest engine_python/tests

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Flutter project exists
        id: check
        run: |
          if [ -f app_flutter/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
      - name: Run Flutter tests
        if: steps.check.outputs.exists == 'true'
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter test
